stages:
  - deploy

pages:
  image: node:22-alpine3.19
  stage: deploy
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never # Don't run for other branches
  script:
    # If there are any install/build steps, do them before the copy
    - cd current
    - npm install
    - npm run build
    - cd ..

    # Build React project from archive/25
    - cd archive/25
    - npm install
    - npm run build
    - cd ../..

    # Create public directory structure
    - mkdir -p public

    - mv current/dist/* archive
    - mv archive public

    # Move built React site to /25 (hacktx.com/25)
    - mkdir -p public/25
    - mv archive/25/dist/* public/25/

  artifacts:
    paths:
      - public
