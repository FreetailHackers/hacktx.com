stages:
  - deploy

pages:
  image: node:22-alpine3.19
  stage: deploy
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never # Don't run for other branches
  script:
    # Build Next.js project (outputs to current/out/)
    - cd current
    - npm install
    - npm run build
    - cd ..

    # Build Vite project from archive/25
    - cd archive/25
    - npm install
    - npm run build
    - cd ../..

    # Move Next.js static export to archive root (serves as hacktx.com/)
    - cp -r current/out/. archive/

    # Replace archive/25 source with its built output
    - mv archive/25/dist archive/25-temp
    - rm -rf archive/25
    - mv archive/25-temp archive/25

    # Publish archive as GitLab Pages public folder
    - mv archive public

  artifacts:
    paths:
      - public
