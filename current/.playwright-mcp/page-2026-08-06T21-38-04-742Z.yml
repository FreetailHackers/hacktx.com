      - article [ref=e35]:
        - heading "What is HackTX?" [level=3] [ref=e36]
        - paragraph [ref=e37]: HackTX is the University of Texas at Austin's largest hackathon, bringing together hundreds of students from across the country for 24 hours of building, learning, and creating. Whether you're a seasoned engineer or picking up your first line of code, HackTX is the place to turn bold ideas into real projects.
      - article [ref=e38]:
        - heading "What to Expect" [level=3] [ref=e39]
        - paragraph [ref=e40]: Over the course of one weekend, hackers team up to design and build projects from scratch — apps, hardware, games, and everything in between. Between hacking sessions, you'll find workshops led by industry engineers, networking opportunities with top sponsors, free food, and a whole lot of fun.
      - article [ref=e41]:
        - heading "Who Can Join?" [level=3] [ref=e42]
        - paragraph [ref=e43]: HackTX is open to all currently enrolled college students, regardless of major, experience level, or school. We believe the best hacks come from diverse teams with different perspectives. Apply as an individual and we'll help you find a team, or come with friends — everyone is welcome.
