    - heading "About Us" [level=2] [ref=f9e39]
    - paragraph [ref=f9e41]: HackTX is a 24-hour hackathon where technologists from across the country gather in Austin to build, imagine, and create together. Like any good fairy tale, it begins with curious minds, bold ideas, and the belief that something meaningful can be made from nothing.
    - paragraph [ref=f9e43]: Join us for HackTX 2026 and become part of a growing tradition. Over the past decade, HackTX has welcomed more than 5,000 participants and awarded over $100,000 in prizes — and this year's story is just getting started.
    - paragraph [ref=f9e45]: Backed by a dedicated team of over 60 organizers across six committees, we design events that spark creativity, encourage collaboration, and push the boundaries of what's possible, one chapter at a time.
